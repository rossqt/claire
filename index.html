<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claire's 22nd Birthday</title>

<style>
@import url('https://fonts.googleapis.com/css?family=Indie+Flower');
@import url('https://fonts.googleapis.com/css?family=Amatic+SC');

body{
    font-family:'Indie Flower',cursive;
    background:#FDE3A7;
    margin:0;
    padding:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* greeting text */
.greetings span{
    font-size:70px;
    margin:5px;
    display:inline-block;
    color:#C0392B;
    animation: float 2s ease-in-out infinite;
}

.greetings span:nth-child(1){animation-delay:0s;}
.greetings span:nth-child(2){animation-delay:0.2s;}
.greetings span:nth-child(3){animation-delay:0.4s;}
.greetings span:nth-child(4){animation-delay:0.6s;}
.greetings span:nth-child(5){animation-delay:0.8s;}

@keyframes float{
    0%,100%{ transform:translateY(0);}
    50%{ transform:translateY(-15px);}
}

/* description */
.description{
    margin-top:15px;
    font-size:25px;
    color:#013243;
    text-align:center;
    font-family:'Amatic SC',cursive;
}

/* button */
.button{
    margin-top:40px;
}

button{
    background:#1BBC9B;
    border:none;
    padding:15px 40px;
    border-radius:50px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

button a{
    text-decoration:none;
    color:white;
    font-size:20px;
    font-family:'Amatic SC',cursive;
}

button:hover{
    background:#C0392B;
    transform:scale(1.1);
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
}


@keyframes hearts{
    from{transform:translateY(0);}
    to{transform:translateY(-120vh);}
}
</style>

</head>

<body>

<div class="greetings">
<span>H</span>
<span>E</span>
<span>L</span>
<span>L</span>
<span>O</span>
</div>

<div class="description">
<span>I have a special gift for you &lt;3</span>
</div>

<div class="button">
<button>
<a href="card.html">Click me</a>
</button>
</div>

</body>
</html>
